global(
    DefaultNetstreamDriver="gtls"
    DefaultNetstreamDriverCAFile="/etc/rsyslog-certs/ca.crt"
)

*.* action(
    type="omfwd"
    target="syslog-server-tls"
    port="6514"
    protocol="tcp"
    StreamDriver="gtls"
    StreamDriverMode="1"
    StreamDriverAuthMode="anon"
    action.resumeRetryCount="-1"
    queue.type="linkedList"
)
