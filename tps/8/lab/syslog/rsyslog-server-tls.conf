global(
    DefaultNetstreamDriver="gtls"
    DefaultNetstreamDriverCAFile="/etc/rsyslog-certs/ca.crt"
    DefaultNetstreamDriverCertFile="/etc/rsyslog-certs/server.crt"
    DefaultNetstreamDriverKeyFile="/etc/rsyslog-certs/server.key"
)

module(load="imtcp"
       StreamDriver.Name="gtls"
       StreamDriver.Mode="1"
       StreamDriver.AuthMode="anon")

input(type="imtcp" port="6514" ruleset="remoteTls")

template(name="perHostTls" type="string"
         string="/var/log/remote/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log")

template(name="labLineTls" type="string"
         string="%TIMESTAMP% %HOSTNAME% pri=%PRI% severity=%syslogseverity% %syslogtag% %msg%\n")

ruleset(name="remoteTls") {
    action(type="omfile" dynaFile="perHostTls" template="labLineTls" createDirs="on")
}
