module(load="imudp")
input(type="imudp" port="514" ruleset="remote")

template(name="perHost" type="string"
         string="/var/log/remote/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log")

template(name="labLine" type="string"
         string="%TIMESTAMP% %HOSTNAME% pri=%PRI% severity=%syslogseverity% %syslogtag% %msg%\n")

ruleset(name="remote") {
    action(type="omfile" dynaFile="perHost" template="labLine" createDirs="on")
}
